name: Terraform IaC CI/CD (AWS)

on:
  push:
    branches: [implementacion-aws]
  pull_request:
    branches: [implementacion-aws]
  workflow_dispatch:
    inputs:
      action:
        description: "¿Solo plan o aplicar cambios en AWS?"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: wikijs-terraform-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_my_ip: ${{ vars.SSH_ALLOWED_CIDR }}
  TF_VAR_key_name: ${{ vars.EC2_KEY_PAIR }}

jobs:
  validate:
    name: fmt + init + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: Formato
        run: terraform fmt -check -recursive
      - name: Inicializar sin backend (no requiere AWS)
        run: terraform init -backend=false -input=false
      - name: Validar HCL y referencias
        run: terraform validate -no-color

  plan:
    name: plan (aplicar solo con permiso manual)
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Inicializar estado remoto S3
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=wikijs/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Preparar cambios
        run: terraform plan -lock-timeout=5m -input=false -no-color -out=tfplan
      - name: Aplicar (solo workflow_dispatch action=apply)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -lock-timeout=5m -input=false -auto-approve tfplan
